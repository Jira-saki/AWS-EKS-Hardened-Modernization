apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-api
  namespace: default
  labels:
    app: secure-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-api
  template:
    metadata:
      labels:
        app: secure-api
    spec:
      nodeSelector:
        node-role.kubernetes.io/workload: "true"
      containers:
      - name: secure-api
        image: python:3.10-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install --no-cache-dir fastapi uvicorn prometheus-fastapi-instrumentator
            cat << 'EOC' > /app/main.py
            import time, math
            from fastapi import FastAPI
            from prometheus_fastapi_instrumentator import Instrumentator

            app = FastAPI(title="Secure-API", version="1.0.0")
            Instrumentator().instrument(app).expose(app, endpoint="/metrics")

            @app.get("/")
            def root():
                return {"status": "healthy", "service": "secure-api"}

            @app.get("/cpu-burn")
            def burn(duration: float = 0.05):
                start = time.time()
                while time.time() - start < duration:
                    _ = math.sqrt(123456.789) * math.sin(9876.543)
                return {"status": "burned", "duration": duration}
            EOC
            uvicorn main:app --host 0.0.0.0 --port 8000
        workingDir: /app
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: secure-api
  namespace: default
  labels:
    app: secure-api
spec:
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: secure-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secure-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secure-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: secure-api-monitor
  namespace: default
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: secure-api
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
