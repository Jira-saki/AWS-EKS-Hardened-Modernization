apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-api-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Jira-saki/AWS-EKS-Hardened-Infrastructure.git'
    targetRevision: main
    path: kubernetes/apps/overlays/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
